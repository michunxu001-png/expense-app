<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#0F172A">
<title>记账本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F172A;
  --bg2: #1E293B;
  --bg3: #334155;
  --text: #F1F5F9;
  --text2: #94A3B8;
  --text3: #64748B;
  --accent: #6366F1;
  --accent2: #8B5CF6;
  --red: #F87171;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Noto Sans SC', sans-serif; overflow:hidden; }

/* Layout */
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#screens { flex:1; overflow:hidden; position:relative; }
.screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding-bottom:20px; display:none; }
.screen.active { display:block; }
.screen::-webkit-scrollbar { display:none; }

/* Status bar spacer */
.status-space { height:calc(var(--safe-top) + 8px); }

/* Bottom nav */
#bottom-nav {
  display:flex; align-items:stretch;
  background:var(--bg); border-top:1px solid var(--bg2);
  padding-bottom:var(--safe-bot);
  flex-shrink:0; position:relative; z-index:10;
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:10px 0; background:none; border:none; cursor:pointer;
  color:var(--text3); font-family:inherit; font-size:11px; transition:color .2s;
}
.nav-btn.active { color:var(--accent); }
.nav-btn .nav-icon { font-size:22px; line-height:1; }

/* FAB */
#fab {
  position:fixed; bottom:calc(var(--safe-bot) + 72px); left:50%; transform:translateX(-50%);
  width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:#fff; font-size:28px; font-weight:300; line-height:1;
  box-shadow:0 4px 24px #6366F166; z-index:20;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s, box-shadow .15s;
}
#fab:active { transform:translateX(-50%) scale(0.92); box-shadow:0 2px 12px #6366F144; }

/* Cards & sections */
.header-card {
  margin:12px 16px 0; border-radius:22px; padding:22px 20px 18px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow:0 8px 32px #6366F140;
}
.header-label { font-size:13px; color:#C7D2FE; }
.big-amount { font-size:40px; font-weight:900; color:#fff; letter-spacing:-1px; margin:4px 0 10px; }
.today-row { display:flex; justify-content:space-between; align-items:center; }
.today-label { font-size:13px; color:#C7D2FE; }
.today-pill {
  background:#ffffff22; border-radius:20px; padding:3px 10px;
  font-size:12px; color:#E0E7FF;
}
.month-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.month-btn {
  background:#ffffff22; border:none; border-radius:20px; padding:4px 12px;
  font-size:13px; color:#E0E7FF; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:4px;
}

.section-title {
  font-size:11px; font-weight:700; color:var(--text2); letter-spacing:1px;
  text-transform:uppercase; padding:18px 20px 8px;
}

/* Category pills */
.cat-scroll { display:flex; gap:8px; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
.cat-scroll::-webkit-scrollbar { display:none; }
.cat-pill {
  flex-shrink:0; border-radius:16px; padding:10px 14px;
  display:flex; flex-direction:column; align-items:center; gap:3px; min-width:72px;
  border:1.5px solid transparent;
}
.cat-emoji { font-size:22px; line-height:1.2; }
.cat-name { font-size:11px; font-weight:700; }
.cat-amt { font-size:12px; color:var(--text2); }

/* Date group */
.date-header {
  display:flex; justify-content:space-between; padding:12px 20px 4px;
  font-size:12px; font-weight:700; color:var(--text3);
}
.record-row {
  display:flex; align-items:center; gap:12px;
  padding:11px 16px; cursor:pointer; transition:background .1s; position:relative;
}
.record-row:active { background:var(--bg2); }
.record-icon {
  width:46px; height:46px; border-radius:14px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.record-info { flex:1; min-width:0; }
.record-note { font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.record-cat { font-size:12px; color:var(--text3); margin-top:1px; }
.record-amt { font-size:16px; font-weight:700; color:var(--red); white-space:nowrap; }
.record-del {
  background:none; border:none; color:var(--text3); font-size:16px;
  padding:4px 6px; cursor:pointer; margin-left:4px;
}

/* Empty state */
.empty-state { text-align:center; padding:48px 0; color:var(--text3); font-size:14px; }

/* Stats */
.stats-card { background:var(--bg2); border-radius:20px; margin:0 16px 14px; padding:16px; }
.stats-summary { display:flex; }
.stats-block { flex:1; text-align:center; padding:12px 0; }
.stats-block + .stats-block { border-left:1px solid var(--bg3); }
.stats-val { font-size:18px; font-weight:900; }
.stats-lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.bar-left { display:flex; align-items:center; gap:5px; width:70px; flex-shrink:0; }
.bar-lbl { font-size:12px; color:var(--text2); }
.bar-track { flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); }
.bar-amt { font-size:13px; font-weight:700; width:68px; text-align:right; flex-shrink:0; }
.month-nav { display:flex; align-items:center; justify-content:space-between; padding:12px 20px 4px; }
.month-nav-btn {
  background:var(--bg2); border:none; border-radius:50%; width:34px; height:34px;
  color:var(--accent); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.month-nav-title { font-size:16px; font-weight:700; color:var(--text); }

/* Donut */
.donut-wrap { background:var(--bg2); border-radius:20px; margin:0 16px 14px; padding:16px; display:flex; gap:16px; align-items:center; }
.donut-svg { flex-shrink:0; }
.legend { flex:1; display:flex; flex-direction:column; gap:7px; }
.legend-row { display:flex; align-items:center; gap:7px; }
.legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.legend-name { font-size:12px; color:var(--text2); flex:1; }
.legend-pct { font-size:12px; font-weight:700; color:var(--text); }

/* Modal overlay */
.overlay {
  position:fixed; inset:0; background:#00000088; z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px); opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.overlay.show { opacity:1; pointer-events:all; }
.modal {
  background:var(--bg2); border-radius:28px 28px 0 0;
  padding:12px 20px calc(var(--safe-bot) + 24px);
  width:100%; max-height:92vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.overlay.show .modal { transform:translateY(0); }
.modal-handle { width:40px; height:4px; background:var(--bg3); border-radius:2px; margin:0 auto 14px; }
.modal-title { font-size:18px; font-weight:700; text-align:center; margin-bottom:18px; }

/* Amount input */
.amount-row {
  display:flex; align-items:center;
  background:var(--bg); border-radius:16px; padding:6px 16px;
  border:1.5px solid #6366F166; margin-bottom:18px;
}
.currency { font-size:28px; font-weight:900; color:var(--accent); margin-right:4px; }
#modal-amount {
  background:none; border:none; color:var(--text); font-size:40px; font-weight:900;
  flex:1; width:100%; outline:none; font-family:inherit;
}
#modal-amount::placeholder { color:var(--bg3); }

/* Category grid */
.cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:14px; }
.cat-grid-btn {
  border-radius:14px; padding:10px 4px; display:flex; flex-direction:column;
  align-items:center; gap:4px; cursor:pointer; border:2px solid var(--bg3);
  background:var(--bg); transition:all .15s; font-family:inherit;
}
.cat-grid-btn.selected { border-color:transparent; }
.cat-grid-emoji { font-size:22px; line-height:1.2; }
.cat-grid-name { font-size:11px; color:var(--text2); }
.cat-grid-btn.selected .cat-grid-name { color:#fff; font-weight:700; }

/* Note / date inputs */
.input-field {
  width:100%; background:var(--bg); border:1.5px solid var(--bg3); border-radius:12px;
  padding:13px 14px; color:var(--text); font-size:15px; outline:none;
  font-family:inherit; margin-bottom:10px;
}
.input-field::placeholder { color:var(--text3); }

/* Save button */
.save-btn {
  width:100%; border:none; border-radius:16px; padding:15px;
  color:#fff; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow:0 4px 16px #6366F144; margin-top:8px;
  transition:opacity .2s, transform .15s;
}
.save-btn:disabled { background:var(--bg3); box-shadow:none; opacity:0.7; }
.save-btn:not(:disabled):active { transform:scale(0.97); }

/* Confirm dialog */
.confirm-overlay {
  position:fixed; inset:0; background:#00000099; z-index:60;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.confirm-overlay.show { opacity:1; pointer-events:all; }
.confirm-box {
  background:var(--bg2); border-radius:24px; padding:28px 22px;
  text-align:center; margin:0 32px; width:calc(100% - 64px); max-width:300px;
  transform:scale(0.9); transition:transform .2s;
}
.confirm-overlay.show .confirm-box { transform:scale(1); }
.confirm-btns { display:flex; gap:10px; margin-top:20px; }
.btn-cancel, .btn-confirm {
  flex:1; border:none; border-radius:12px; padding:12px;
  font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn-cancel { background:var(--bg3); color:var(--text2); }
.btn-confirm { background:#EF4444; color:#fff; }

/* Toast */
#toast {
  position:fixed; bottom:calc(var(--safe-bot) + 100px); left:50%; transform:translateX(-50%) translateY(20px);
  background:#22C55E; color:#fff; padding:10px 20px; border-radius:20px;
  font-size:14px; font-weight:700; z-index:100; opacity:0; transition:all .3s; white-space:nowrap;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="screens">
    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="status-space"></div>
      <div class="header-card">
        <div class="month-row">
          <span class="header-label">本月支出</span>
          <button class="month-btn" onclick="openMonthPicker()">
            <span id="home-month-label">1月</span> ▾
          </button>
        </div>
        <div class="big-amount" id="home-total">¥0.00</div>
        <div class="today-row">
          <span class="today-label" id="home-today-total">今日 ¥0.00</span>
          <span class="today-pill" id="home-today-count">0 笔</span>
        </div>
      </div>
      <div class="section-title">支出分类</div>
      <div class="cat-scroll" id="home-cat-pills"></div>
      <div class="section-title">明细记录</div>
      <div id="home-records"></div>
      <div style="height:90px"></div>
    </div>

    <!-- STATS -->
    <div class="screen" id="screen-stats">
      <div class="status-space"></div>
      <div class="month-nav">
        <button class="month-nav-btn" onclick="statsChangeMonth(-1)">‹</button>
        <span class="month-nav-title" id="stats-month-title"></span>
        <button class="month-nav-btn" onclick="statsChangeMonth(1)">›</button>
      </div>
      <div class="stats-card">
        <div class="stats-summary" id="stats-summary"></div>
      </div>
      <div class="section-title">分类明细</div>
      <div class="stats-card" id="stats-bars"></div>
      <div class="section-title">占比分析</div>
      <div class="donut-wrap" id="stats-donut"></div>
      <div style="height:90px"></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav id="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('home')" id="nav-home">
      <span class="nav-icon">🏠</span><span>账单</span>
    </button>
    <button class="nav-btn" onclick="switchTab('stats')" id="nav-stats">
      <span class="nav-icon">📊</span><span>统计</span>
    </button>
  </nav>
</div>

<!-- FAB -->
<button id="fab" onclick="openAdd()">+</button>

<!-- Add/Edit Modal -->
<div class="overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">新增支出</div>
    <div class="amount-row">
      <span class="currency">¥</span>
      <input type="number" id="modal-amount" placeholder="0.00" inputmode="decimal" oninput="updateSaveBtn()">
    </div>
    <div class="cat-grid" id="modal-cat-grid"></div>
    <input class="input-field" type="text" id="modal-note" placeholder="备注（可选）" maxlength="30">
    <input class="input-field" type="date" id="modal-date">
    <button class="save-btn" id="save-btn" onclick="saveRecord()" disabled>记一笔</button>
  </div>
</div>

<!-- Month picker modal -->
<div class="overlay" id="month-overlay" onclick="closeMonthPicker(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">选择月份</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:8px" id="month-grid"></div>
  </div>
</div>

<!-- Delete confirm -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div style="font-size:32px;margin-bottom:8px">🗑️</div>
    <div style="font-weight:700;font-size:16px">确认删除？</div>
    <div style="color:var(--text3);font-size:13px;margin-top:6px">此操作不可撤销</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-confirm" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Data ──────────────────────────────────────────────────────
const CATS = [
  { id:'food',          label:'餐饮', emoji:'🍜', color:'#FF6B6B' },
  { id:'transport',     label:'交通', emoji:'🚇', color:'#4ECDC4' },
  { id:'shop',          label:'购物', emoji:'🛍️', color:'#F59E0B' },
  { id:'entertainment', label:'娱乐', emoji:'🎮', color:'#A78BFA' },
  { id:'health',        label:'医疗', emoji:'💊', color:'#F97316' },
  { id:'housing',       label:'住房', emoji:'🏠', color:'#34D399' },
  { id:'education',     label:'教育', emoji:'📚', color:'#60A5FA' },
  { id:'other',         label:'其他', emoji:'📦', color:'#94A3B8' },
];
const cat = id => CATS.find(c => c.id === id);
const fmt = n => '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayStr = () => new Date().toISOString().slice(0,10);
const friendlyDate = d => {
  const t = todayStr();
  const y = new Date(new Date()-86400000).toISOString().slice(0,10);
  if(d===t) return '今天'; if(d===y) return '昨天';
  const [,m,day] = d.split('-'); return `${+m}月${+day}日`;
};

function loadRecords() {
  try { return JSON.parse(localStorage.getItem('records_v2')||'[]'); } catch(e){ return []; }
}
function saveRecords(records) {
  localStorage.setItem('records_v2', JSON.stringify(records));
}
let records = loadRecords();
if(records.length===0){
  records = [
    {id:Date.now()+'1', amount:38.5, category:'food', note:'午餐', date:todayStr()},
    {id:Date.now()+'2', amount:12, category:'transport', note:'地铁', date:todayStr()},
    {id:Date.now()+'3', amount:299, category:'shop', note:'耳机', date:todayStr()},
  ];
  saveRecords(records);
}

// ── State ─────────────────────────────────────────────────────
const now = new Date();
let homeMonth = now.getMonth()+1;
let homeYear  = now.getFullYear();
let statsMonth = now.getMonth()+1;
let statsYear  = now.getFullYear();
let editId = null;
let deleteId = null;
let selectedCat = 'food';

// ── Tab switching ─────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  if(tab==='home') renderHome();
  if(tab==='stats') renderStats();
}

// ── Home render ───────────────────────────────────────────────
function renderHome() {
  const mo = records.filter(r=>{
    const [y,m] = r.date.split('-').map(Number);
    return m===homeMonth && y===homeYear;
  });
  const total = mo.reduce((s,r)=>s+r.amount, 0);
  const td = records.filter(r=>r.date===todayStr());
  const tdTotal = td.reduce((s,r)=>s+r.amount, 0);

  document.getElementById('home-month-label').textContent = homeMonth+'月';
  document.getElementById('home-total').textContent = fmt(total);
  document.getElementById('home-today-total').textContent = '今日 '+fmt(tdTotal);
  document.getElementById('home-today-count').textContent = td.length+' 笔';

  // Cat pills
  const catStats = CATS.map(c=>{
    const sum = mo.filter(r=>r.category===c.id).reduce((s,r)=>s+r.amount,0);
    return {...c, sum};
  }).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);

  const pillsEl = document.getElementById('home-cat-pills');
  if(catStats.length===0){
    pillsEl.innerHTML = '<span style="color:var(--text3);font-size:13px;padding-left:4px">暂无记录</span>';
  } else {
    pillsEl.innerHTML = catStats.slice(0,6).map(c=>`
      <div class="cat-pill" style="background:${c.color}18;border-color:${c.color}44">
        <span class="cat-emoji">${c.emoji}</span>
        <span class="cat-name" style="color:${c.color}">${c.label}</span>
        <span class="cat-amt">${fmt(c.sum)}</span>
      </div>`).join('');
  }

  // Records grouped by date
  const grouped = {};
  mo.forEach(r=>{ (grouped[r.date]||(grouped[r.date]=[])).push(r); });
  const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a));

  const recEl = document.getElementById('home-records');
  if(dates.length===0){
    recEl.innerHTML = '<div class="empty-state">还没有记录，点击 + 开始记账 ✨</div>';
    return;
  }
  recEl.innerHTML = dates.map(d=>{
    const dayRecs = grouped[d];
    const dayTotal = dayRecs.reduce((s,r)=>s+r.amount,0);
    return `
      <div class="date-header"><span>${friendlyDate(d)}</span><span>${fmt(dayTotal)}</span></div>
      ${dayRecs.map(r=>{
        const c = cat(r.category);
        return `<div class="record-row" onclick="openEdit('${r.id}')">
          <div class="record-icon" style="background:${c.color}18">${c.emoji}</div>
          <div class="record-info">
            <div class="record-note">${r.note||c.label}</div>
            <div class="record-cat">${c.label}</div>
          </div>
          <span class="record-amt">${fmt(r.amount)}</span>
          <button class="record-del" onclick="askDelete(event,'${r.id}')">✕</button>
        </div>`;
      }).join('')}`;
  }).join('');
}

// ── Stats render ──────────────────────────────────────────────
function renderStats() {
  document.getElementById('stats-month-title').textContent = statsYear+'年'+statsMonth+'月';
  const mo = records.filter(r=>{
    const [y,m] = r.date.split('-').map(Number);
    return m===statsMonth && y===statsYear;
  });
  const total = mo.reduce((s,r)=>s+r.amount,0);
  const count = mo.length;

  // Summary
  const avg = count ? total/count : 0;
  document.getElementById('stats-summary').innerHTML = `
    <div class="stats-block"><div class="stats-val" style="color:#6366F1">¥${Math.round(total)}</div><div class="stats-lbl">总支出</div></div>
    <div class="stats-block"><div class="stats-val" style="color:#34D399">${count}</div><div class="stats-lbl">笔数</div></div>
    <div class="stats-block"><div class="stats-val" style="color:#F97316">${count?'¥'+Math.round(avg):'-'}</div><div class="stats-lbl">均单价</div></div>`;

  const catStats = CATS.map(c=>{
    const sum = mo.filter(r=>r.category===c.id).reduce((s,r)=>s+r.amount,0);
    return {...c, sum};
  }).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);

  const maxSum = catStats[0]?.sum||1;

  // Bars
  document.getElementById('stats-bars').innerHTML = catStats.length===0
    ? '<div class="empty-state" style="padding:24px 0">暂无数据</div>'
    : catStats.map(c=>`
      <div class="bar-row">
        <div class="bar-left"><span style="font-size:18px">${c.emoji}</span><span class="bar-lbl">${c.label}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${c.sum/maxSum*100}%;background:${c.color}"></div></div>
        <span class="bar-amt" style="color:${c.color}">¥${Math.round(c.sum)}</span>
      </div>`).join('');

  // Donut
  if(catStats.length===0){
    document.getElementById('stats-donut').innerHTML = '<div style="color:var(--text3);font-size:13px">暂无数据</div>';
    return;
  }
  // Build SVG donut
  let offset=25, paths='';
  catStats.forEach(c=>{
    const pct = c.sum/total*100;
    const dash = pct;
    paths += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${c.color}" stroke-width="5"
      stroke-dasharray="${dash} ${100-dash}" stroke-dashoffset="${-offset+25}" transform="rotate(-90 21 21)"/>`;
    offset += dash;
  });
  const svg = `<svg class="donut-svg" width="120" height="120" viewBox="0 0 42 42">
    <circle cx="21" cy="21" r="15.9" fill="none" stroke="#1E293B" stroke-width="5"/>
    ${paths}
    <text x="21" y="22" text-anchor="middle" font-size="4.5" fill="#F1F5F9" font-weight="700" font-family="sans-serif">${statsMonth}月</text>
  </svg>`;
  const legend = `<div class="legend">${catStats.map(c=>`
    <div class="legend-row">
      <span class="legend-dot" style="background:${c.color}"></span>
      <span class="legend-name">${c.label}</span>
      <span class="legend-pct">${(c.sum/total*100).toFixed(1)}%</span>
    </div>`).join('')}</div>`;
  document.getElementById('stats-donut').innerHTML = svg+legend;
}

function statsChangeMonth(dir){
  statsMonth += dir;
  if(statsMonth>12){statsMonth=1;statsYear++;}
  if(statsMonth<1){statsMonth=12;statsYear--;}
  renderStats();
}

// ── Month picker ──────────────────────────────────────────────
function openMonthPicker(){
  const grid = document.getElementById('month-grid');
  grid.innerHTML = Array.from({length:12},(_,i)=>`
    <button onclick="selectMonth(${i+1})" style="
      padding:12px 4px; border-radius:12px; border:none; cursor:pointer; font-family:inherit;
      font-size:14px; font-weight:${homeMonth===i+1?'700':'400'};
      background:${homeMonth===i+1?'var(--accent)':'var(--bg3)'};
      color:${homeMonth===i+1?'#fff':'var(--text2)'};
    ">${i+1}月</button>`).join('');
  document.getElementById('month-overlay').classList.add('show');
}
function selectMonth(m){
  homeMonth=m;
  document.getElementById('month-overlay').classList.remove('show');
  renderHome();
}
function closeMonthPicker(e){
  if(e.target===document.getElementById('month-overlay'))
    document.getElementById('month-overlay').classList.remove('show');
}

// ── Add / Edit ────────────────────────────────────────────────
function buildCatGrid(){
  document.getElementById('modal-cat-grid').innerHTML = CATS.map(c=>`
    <button class="cat-grid-btn${selectedCat===c.id?' selected':''}" id="catbtn-${c.id}"
      style="${selectedCat===c.id?'background:'+c.color+';border-color:'+c.color:''}"
      onclick="selectCat('${c.id}')">
      <span class="cat-grid-emoji">${c.emoji}</span>
      <span class="cat-grid-name">${c.label}</span>
    </button>`).join('');
}
function selectCat(id){
  selectedCat = id;
  buildCatGrid();
}
function openAdd(){
  editId=null; selectedCat='food';
  document.getElementById('modal-title').textContent='新增支出';
  document.getElementById('modal-amount').value='';
  document.getElementById('modal-note').value='';
  document.getElementById('modal-date').value=todayStr();
  document.getElementById('save-btn').textContent='记一笔';
  buildCatGrid(); updateSaveBtn();
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('modal-amount').focus(),300);
}
function openEdit(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editId=id; selectedCat=r.category;
  document.getElementById('modal-title').textContent='编辑记录';
  document.getElementById('modal-amount').value=r.amount;
  document.getElementById('modal-note').value=r.note;
  document.getElementById('modal-date').value=r.date;
  document.getElementById('save-btn').textContent='保存修改';
  buildCatGrid(); updateSaveBtn();
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e){
  if(e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('show');
}
function updateSaveBtn(){
  const v = parseFloat(document.getElementById('modal-amount').value);
  document.getElementById('save-btn').disabled = !(v>0);
}
function saveRecord(){
  const amt = parseFloat(document.getElementById('modal-amount').value);
  if(!(amt>0)) return;
  const note = document.getElementById('modal-note').value.trim();
  const date = document.getElementById('modal-date').value||todayStr();
  if(editId){
    records = records.map(r=>r.id===editId?{...r,amount:amt,category:selectedCat,note,date}:r);
  } else {
    records.unshift({id:Date.now()+'', amount:amt, category:selectedCat, note, date});
  }
  saveRecords(records);
  document.getElementById('modal-overlay').classList.remove('show');
  showToast(editId?'已保存修改 ✓':'记录成功 ✓');
  renderHome();
}

// ── Delete ────────────────────────────────────────────────────
function askDelete(e, id){
  e.stopPropagation();
  deleteId=id;
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirm-overlay').classList.remove('show');
  deleteId=null;
}
function confirmDelete(){
  if(!deleteId) return;
  records = records.filter(r=>r.id!==deleteId);
  saveRecords(records);
  closeConfirm();
  showToast('已删除');
  renderHome();
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ── Init ──────────────────────────────────────────────────────
renderHome();
renderStats();
</script>
</body>
</html>
